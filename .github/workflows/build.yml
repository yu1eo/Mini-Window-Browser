name: Build and test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feature/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore .\小窗.slnx

      - name: Build x64 Release
        run: msbuild .\小窗.slnx /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Run core tests
        run: .\x64\Release\XiaoChuang.Tests.exe

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XiaoChuang-x64-Release
          path: |
            x64\Release\XiaoChuang.exe
            x64\Release\WebView2Loader.dll
          if-no-files-found: warn
